name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A superseded run is cancelled rather than left to burn runner minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The run number is the version code, so every published build outranks the
      # last and the in-app updater can compare them.
      VERSION_CODE: ${{ github.run_number }}
      # Job-scoped so the decode step's `if` can see it: a step cannot read its own
      # step-level env in its condition.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gating this on the secret would make it skip in exactly the case it exists to
      # catch, so it runs unconditionally for builds that will be published. It also
      # probes the vars context, since values added under the Variables tab rather
      # than Secrets are the common cause and are invisible to secrets.*.
      - name: Require the signing secrets
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref_name == github.event.repository.default_branch
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AS_VAR_KEYSTORE_BASE64: ${{ vars.KEYSTORE_BASE64 }}
          AS_VAR_KEYSTORE_PASSWORD: ${{ vars.KEYSTORE_PASSWORD }}
          AS_VAR_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          AS_VAR_KEY_PASSWORD: ${{ vars.KEY_PASSWORD }}
        run: |
          state() { if [ -n "$1" ]; then echo present; else echo absent; fi; }

          echo "As secrets:"
          echo "  KEYSTORE_BASE64   $(state "$KEYSTORE_BASE64")"
          echo "  KEYSTORE_PASSWORD $(state "$KEYSTORE_PASSWORD")"
          echo "  KEY_ALIAS         $(state "$KEY_ALIAS")"
          echo "  KEY_PASSWORD      $(state "$KEY_PASSWORD")"
          echo "As variables:"
          echo "  KEYSTORE_BASE64   $(state "$AS_VAR_KEYSTORE_BASE64")"
          echo "  KEYSTORE_PASSWORD $(state "$AS_VAR_KEYSTORE_PASSWORD")"
          echo "  KEY_ALIAS         $(state "$AS_VAR_KEY_ALIAS")"
          echo "  KEY_PASSWORD      $(state "$AS_VAR_KEY_PASSWORD")"

          missing=""
          test -n "$KEYSTORE_BASE64"   || missing="$missing KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD" || missing="$missing KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"         || missing="$missing KEY_ALIAS"
          test -n "$KEY_PASSWORD"      || missing="$missing KEY_PASSWORD"
          [ -n "$missing" ] || { echo "All four signing secrets are present."; exit 0; }

          if [ -n "$AS_VAR_KEYSTORE_BASE64$AS_VAR_KEYSTORE_PASSWORD$AS_VAR_KEY_ALIAS$AS_VAR_KEY_PASSWORD" ]; then
            echo "::warning::Found these values under the Variables tab, not Secrets."
            echo "Delete them from Variables and re-add under the Secrets tab:"
            echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            echo "Variables are readable by anyone who can see the repository, so the"
            echo "keystore and its passwords must not stay there — treat them as leaked"
            echo "and generate a new key if they were exposed."
          else
            echo "::warning::Missing repository secrets:$missing"
            echo "They are not visible as secrets or as variables, so they are either in"
            echo "another repository, under Dependabot secrets, or scoped to an"
            echo "Environment. Add them here as Repository secrets:"
            echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
          fi
          echo "Continuing with debug signing. The published build will install only"
          echo "after uninstalling any existing copy, and cannot update itself."

      - name: Decode the signing keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Proves the published build carries the release key rather than the debug one,
      # since an APK signed with the wrong key cannot update an installed copy.
      - name: Verify the APK signature
        env:
          EXPECTED_SHA256: 32DCC8B46E64FD24BFD1697EF60BFE6C8DB45FD7AC847ADE2C24ABFF6BD807DE
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          CERTS=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$CERTS"
          ACTUAL=$(echo "$CERTS" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'a-f' 'A-F')
          echo "signer SHA-256: $ACTUAL"
          if [ "$ACTUAL" = "$EXPECTED_SHA256" ]; then
            echo "Signed with the release key: in-app updates will work."
          else
            echo "::warning::APK is debug-signed, not signed with the release key."
            echo "Install it by uninstalling any existing copy first; it cannot update in place."
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: connection-checker-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Run unit tests
        timeout-minutes: 10
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # The rolling release carries the APK and the manifest the app reads to
      # discover it, so the download URL and the version it claims stay in step.
      - name: Publish the APK and update manifest
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "No release APK at $APK"; ls -R app/build/outputs/apk; exit 1; }

          VERSION_NAME="0.3.${VERSION_CODE}"
          NOTES=$(git log -1 --pretty=%s)

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          SIGNER=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'a-f' 'A-F')
          if [ "$SIGNER" = "32DCC8B46E64FD24BFD1697EF60BFE6C8DB45FD7AC847ADE2C24ABFF6BD807DE" ]; then
            SIGNING="Release-signed: installs over the previous release-signed build, and updates in-app."
          else
            SIGNING="DEBUG-SIGNED: uninstall any existing copy before installing, and in-app update will not work. Add the signing secrets to fix this."
          fi

          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/app-release.apk" \
            --arg notes "$NOTES" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, notes: $notes}' \
            > version.json

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            "$APK" version.json \
            --title "Latest build ($VERSION_NAME)" \
            --prerelease \
            --notes "$VERSION_NAME — $NOTES

          $SIGNING

          Install app-release.apk on Android 7.0 (API 24) or newer."

      # The app is useless at updating if these URLs do not resolve, so the run
      # fails here rather than shipping a build that cannot find its own manifest.
      - name: Verify the published update URLs resolve
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref_name == github.event.repository.default_branch
        run: |
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest"

          MANIFEST=$(curl -sSL --retry 5 --retry-delay 3 --retry-all-errors "$BASE/version.json")
          echo "$MANIFEST"
          echo "$MANIFEST" | jq -e '.versionCode == '"$VERSION_CODE" > /dev/null \
            || { echo "Published manifest does not advertise version $VERSION_CODE"; exit 1; }

          APK_URL=$(echo "$MANIFEST" | jq -r '.apkUrl')
          CODE=$(curl -sSL --retry 5 --retry-delay 3 --retry-all-errors \
            -o /dev/null -w '%{http_code}' "$APK_URL")
          test "$CODE" = "200" || { echo "APK URL $APK_URL returned $CODE"; exit 1; }
          echo "Manifest and APK URLs both resolve."
