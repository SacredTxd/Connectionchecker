name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A superseded run is cancelled rather than left to burn runner minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The APK is assembled and uploaded before the tests run, so a hanging or
      # failing test still leaves a downloadable build.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: connection-checker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        timeout-minutes: 10
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # A rolling prerelease so the APK has a stable, direct download URL that
      # always points at the newest build of the default branch. The release is
      # recreated each time so its tag follows the commit it was built from.
      - name: Publish the APK to the rolling release
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Debug-signed build of ${GITHUB_SHA:0:7}, rebuilt automatically on each push. Install app-debug.apk on Android 7.0 (API 24) or newer; Android will ask you to allow installation from an unknown source, because the build is debug-signed rather than release-signed."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest debug build" \
            --prerelease \
            --notes "$NOTES"
